<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- HTML Meta Refresh fallback for instant redirect -->
    <meta http-equiv="refresh" content="0;url=https://www.example.com">
    <title>Gauranga</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .redirect-box {
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
        }
        h2 { color: #333; margin-bottom: 10px; }
        p { color: #666; font-size: 14px; }
        a { color: #007bff; text-decoration: none; font-weight: bold; }
        a:hover { text-decoration: underline; }
    </style>
    <script>
        // JavaScript instant redirect
        window.location.replace("https://sites.google.com/view/imgauranga");
    </script>
</head>
<body>

    <div class="redirect-box">
        <h2>Redirecting...</h2>
        <p>If you are not redirected automatically, please <a href="https://www.example.com">click here</a>.</p>
    </div>

</body>
</html>
