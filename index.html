<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fbf9f5" id="themeMeta"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <link href='https://imgh.in/host/yr404b' rel='icon' type='image/x-icon'/>
  <link href='https://imgh.in/host/yr404b' rel='shortcut icon' type='image/x-icon'/>
  <title>Personal Diary</title>
  <!-- Google Fonts for Editorial Luxury Look -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script>
    if (window.location.search.includes('i=')) {
      var cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
      window.history.replaceState({path: cleanUrl}, '', cleanUrl);
    }
  </script>
  <style>
    /* =========================================
       PREMIUM DAY & NIGHT THEME VARIABLES
       ========================================= */
    :root {
      /* Default: Warm Editorial Day Mode */
      --bg-body: #f5f2eb;
      --bg-ambient-1: rgba(212, 163, 89, 0.14);
      --bg-ambient-2: rgba(148, 163, 184, 0.14);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(24, 24, 27, 0.08);
      --card-shadow: 0 24px 50px -12px rgba(28, 25, 23, 0.08), 0 4px 16px rgba(28, 25, 23, 0.03);
      --text-primary: #1c1917;
      --text-secondary: #57534e;
      --text-muted: #78716c;
      --accent-color: #b47b38;
      --accent-soft: rgba(180, 123, 56, 0.12);
      --accent-hover: #9a6529;
      --btn-bg: #ffffff;
      --btn-border: rgba(28, 25, 23, 0.1);
      --btn-hover: #faf8f5;
      --modal-overlay: rgba(28, 25, 23, 0.45);
      --modal-bg: #ffffff;
      --input-bg: #faf8f5;
      --dot-color: #e11d48;
      --scrollbar-thumb: rgba(28, 25, 23, 0.15);
    }

    [data-theme="dark"] {
      /* Deep Dark Black + Subtle Midnight Blue Premium Night Mode */
      --bg-body: #05070c;
      --bg-ambient-1: rgba(29, 78, 216, 0.11);
      --bg-ambient-2: rgba(14, 165, 233, 0.07);
      --card-bg: rgba(9, 13, 22, 0.86);
      --card-border: rgba(56, 189, 248, 0.14);
      --card-shadow: 0 30px 65px -15px rgba(0, 0, 0, 0.88), 0 0 1px rgba(96, 165, 250, 0.25);
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #8b9bb4;
      --accent-color: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.14);
      --accent-hover: #3b82f6;
      --btn-bg: rgba(15, 23, 42, 0.85);
      --btn-border: rgba(96, 165, 250, 0.18);
      --btn-hover: rgba(23, 35, 62, 0.96);
      --modal-overlay: rgba(2, 4, 9, 0.85);
      --modal-bg: #0b101b;
      --input-bg: #0f172a;
      --dot-color: #38bdf8;
      --scrollbar-thumb: rgba(148, 163, 184, 0.2);
    }

    [data-theme="dark"] .post-body {
      box-shadow: none;
    }

    /* =========================================
       BASE & RESET STYLES
       ========================================= */
    html {
      -webkit-tap-highlight-color: rgba(255, 255, 255, 0);
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      boder-top: 0.1px solid #212529;
      scrollbar-color: rgba(0, 0, 0, 0) white;
      scrollbar-width: thin;
    }

    *::-webkit-scrollbar {
      display: none;
    }
    *::-webkit-resizer {
      display: none;
    }
    ::-webkit-scrollbar {
      width: 0px;
      height: 0px;
      background-color: white;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0);
      border-radius: 0px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100dvh;
      width: 100%;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-primary);
      transition: background-color 0.4s ease, color 0.4s ease;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient Soft Background Glows */
    body::before, body::after {
      content: '';
      position: fixed;
      width: 45vw;
      height: 45vw;
      border-radius: 50%;
      filter: blur(110px);
      z-index: 0;
      pointer-events: none;
      transition: background 0.5s ease;
    }
    body::before {
      top: -10%;
      left: -10%;
      background: var(--bg-ambient-1);
    }
    body::after {
      bottom: -10%;
      right: -10%;
      background: var(--bg-ambient-2);
    }

    /* Custom Subtle Scrollbar for Diary Content */
    #fic::-webkit-scrollbar, .txt-textarea::-webkit-scrollbar {
      width: 5px;
    }
    #fic::-webkit-scrollbar-track, .txt-textarea::-webkit-scrollbar-track {
      background: transparent;
    }
    #fic::-webkit-scrollbar-thumb, .txt-textarea::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 10px;
    }

    /* =========================================
       MAIN APP LAYOUT & GLASS CARD
       ========================================= */
    .app-wrapper {
      position: relative;
      z-index: 1;
      height: 100%;
      width: 100%;
      padding: 25px;
    }

    #bman {
      box-shadow: rgba(17, 17, 26, 0.1) 0px 0px 16px;
      width: 100%;
      max-width: 720px;
      height: 90dvh;
      max-height: 720px;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Top Header Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent-color);
      display: inline-block;
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-action-btn {
      padding: 10px 15px;
      font-size: 0.86rem;
      font-weight: 500;
      border-radius: 50px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: all 0.25s ease;
    }
    .header-action-btn:hover {
      background: var(--btn-hover);
      border-color: var(--accent-color);
      transform: translateY(-1px);
    }
    .header-action-btn svg {
      color: var(--accent-color);
      flex-shrink: 0;
    }

    /* Day / Night Theme Toggle Button */
    .theme-toggle-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text-primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      transition: all 0.25s ease;
      flex-shrink: 0;
    }
    .theme-toggle-btn:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
      transform: rotate(15deg) scale(1.05);
    }

    /* =========================================
       SCROLLABLE POST CONTENT AREA
       ========================================= */
    #fic {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 20px 6px;
      margin: 4px 0;
    }

    .post-card {
      animation: fadeSlideUp 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .post-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .post-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 700;
      font-size: 2.15rem;
      color: var(--text-primary);
      line-height: 1.2;
      margin-bottom: 12px;
      letter-spacing: -0.01em;
    }

    .post-meta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: var(--accent-soft);
      padding: 6px 14px 6px 16px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--accent-color);
    }

    .date-badge {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .audio-control-btn {
      background: var(--accent-color);
      border: none;
      color: #ffffff;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }
    .audio-control-btn:hover {
      background: var(--accent-hover);
      transform: scale(1.08);
    }
    .audio-control-btn.playing {
      animation: pulseRing 1.5s infinite;
    }

    @keyframes pulseRing {
      0% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(96, 165, 250, 0); }
      100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0); }
    }

    .post-body {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 400;
      line-height: 1.9;
      font-size: 32px;
      color: var(--text-secondary);
      white-space: pre-wrap;
      text-align: left;
      padding: 15px 13px;
      border-radius: 14px;
      letter-spacing: 0.005em;
    }

    /* =========================================
       LOADER
       ========================================= */
    .loader {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid var(--accent-soft);
      border-radius: 50%;
      border-top-color: var(--accent-color);
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* =========================================
       BOTTOM PAGINATION BAR
       ========================================= */
    .pagination-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding-top: 16px;
      border-top: 1px solid var(--card-border);
    }

    .nav-btn {
      flex: 1;
      padding: 13px 20px;
      font-size: 0.92rem;
      font-weight: 600;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text-primary);
      border-radius: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
    }
    .nav-btn:hover:not(:disabled) {
      background: var(--accent-color);
      border-color: var(--accent-color);
      color: #ffffff;
      transform: translateY(-1px);
      box-shadow: 0 8px 20px -6px var(--accent-soft);
    }
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* =========================================
       MODAL POPUPS (CALENDAR & DIRECT TXT SHARE)
       ========================================= */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: var(--modal-overlay);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }

    .calendar-modal, .share-txt-modal {
      background: var(--modal-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--card-shadow);
      width: 100%;
      border-radius: 22px;
      padding: 26px;
      animation: modalPop 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .calendar-modal {
      max-width: 420px;
    }
    .share-txt-modal {
      max-width: 460px;
    }
    @keyframes modalPop {
      from { transform: scale(0.94); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .cal-header, .txt-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      color: var(--text-primary);
    }

    .cal-header button {
      background: var(--accent-soft);
      border: none;
      height: 36px;
      width: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--accent-color);
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
    }
    .cal-header button:hover {
      background: var(--accent-color);
      color: #ffffff;
    }

    .cal-header span, .txt-modal-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .txt-badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 50px;
      background: var(--accent-soft);
      color: var(--accent-color);
    }

    .txt-field-group {
      margin-bottom: 16px;
    }

    .txt-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 7px;
    }

    .txt-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 7px;
    }
    .txt-label-row .txt-label {
      margin-bottom: 0;
    }

    /* Voice Speak Button inside Quick TXT Share */
    .txt-speak-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 50px;
      border: 1px solid var(--btn-border);
      background: var(--accent-soft);
      color: var(--accent-color);
      font-size: 0.78rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .txt-speak-btn:hover {
      background: var(--accent-color);
      color: #ffffff;
      border-color: var(--accent-color);
    }
    .txt-speak-btn.speaking {
      background: var(--accent-color);
      color: #ffffff;
      animation: pulseRing 1.5s infinite;
    }

    .txt-title-row {
      display: flex;
      align-items: center;
      background: var(--input-bg);
      border: 1px solid var(--btn-border);
      border-radius: 14px;
      padding: 0 12px;
      transition: border-color 0.2s ease;
    }
    .txt-title-row:focus-within, .txt-textarea:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .txt-input {
      flex: 1;
      border: none;
      background: transparent;
      padding: 12px 4px;
      font-size: 0.94rem;
      font-family: inherit;
      color: var(--text-primary);
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .txt-ext {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      user-select: none;
    }

    .txt-textarea {
      width: 100%;
      height: 140px;
      min-height: 140px;
      max-height: 140px;
      resize: none;
      overflow-y: auto;
      box-sizing: border-box;
      background: var(--input-bg);
      border: 1px solid var(--btn-border);
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 0.95rem;
      line-height: 1.65;
      font-family: inherit;
      color: var(--text-primary);
      transition: border-color 0.2s ease;
      -webkit-user-select: text;
      user-select: text;
    }

    .txt-modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    .txt-share-btn {
      flex: 1.4;
      padding: 13px 16px;
      border-radius: 14px;
      border: none;
      background: var(--accent-color);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .txt-share-btn:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .txt-cancel-btn {
      flex: 1;
      padding: 13px 14px;
      border-radius: 14px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .txt-cancel-btn:hover {
      background: var(--accent-soft);
      color: var(--accent-color);
    }

    .cal-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
    }

    .cal-day {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 12px;
      cursor: default;
      position: relative;
      color: var(--text-muted);
      transition: all 0.2s ease;
    }
    .cal-day.has-post {
      color: var(--text-primary);
      font-weight: 700;
      background: var(--accent-soft);
      cursor: pointer;
    }
    .cal-day.has-post:hover {
      background: var(--accent-color);
      color: #ffffff;
      transform: scale(1.06);
    }
    .cal-day.has-post::after {
      content: '';
      position: absolute;
      bottom: 5px;
      width: 5px;
      height: 5px;
      background-color: var(--dot-color);
      border-radius: 50%;
    }
    .cal-day.has-post:hover::after {
      background-color: #ffffff;
    }

    .modal-close-btn {
      margin-top: 22px;
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--btn-border);
      background: var(--btn-bg);
      color: var(--text-primary);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .modal-close-btn:hover {
      background: var(--accent-soft);
      color: var(--accent-color);
    }

    /* =========================================
       RESPONSIVE MOBILE ADJUSTMENTS
       ========================================= */
    @media (max-width: 600px) {
      .app-wrapper {
        padding: 12px;
      }
      #bman {
        height: 95dvh;
        max-height: 95dvh;
        padding: 16px 16px;
        border-radius: 22px;
      }
      .top-bar {
        padding-bottom: 12px;
      }
      .brand-title {
        font-size: 1.9em;
      }
      .top-controls {
        gap: 13px;
      }
      .header-action-btn span {
        display: none;
      }
      .header-action-btn {
        padding: 9px;
      }
      .theme-toggle-btn {
        width: 36px;
        height: 36px;
      }
      #fic {
        padding: 14px 4px;
      }
      .post-header {
        margin-bottom: 14px;
      }
      .post-title {
        font-size: 1.8rem;
        margin-bottom: 8px;
      }
      .post-body {
        font-size: 21px;
        line-height: 1.78;
        padding: 13px 16px;
      }
      .pagination-container {
        padding-top: 12px;
        gap: 10px;
      }
      .nav-btn {
        padding: 11px 14px;
        font-size: 0.86rem;
        border-radius: 14px;
      }
      .share-txt-modal {
        padding: 20px;
        border-radius: 22px;
      }
    }
  </style>
</head>
<body>

  <!-- Calendar Modal Popup -->
  <div id="calendarModal" class="modal-overlay" onclick="handleModalOutsideClick(event, 'calendarModal')">
    <div class="calendar-modal">
      <div class="cal-header">
        <button onclick="changeMonth(-1)" aria-label="Previous Month">&#8592;</button>
        <span id="calMonthYear">Month Year</span>
        <button onclick="changeMonth(1)" aria-label="Next Month">&#8594;</button>
      </div>
      <div class="cal-weekdays">
        <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
      </div>
      <div id="calDaysGrid" class="cal-days"></div>
      <button class="modal-close-btn" onclick="toggleCalendarModal(false)">Close</button>
    </div>
  </div>

  <!-- Direct TXT Share Modal Popup (Direct Android/iOS Share Sheet Only, No File Download) -->
  <div id="shareTxtModal" class="modal-overlay" onclick="handleModalOutsideClick(event, 'shareTxtModal')">
    <div class="share-txt-modal">
      <div class="txt-modal-header">
        <h2 class="txt-modal-title">Quick TXT Share</h2>
        <span class="txt-badge">Direct Share</span>
      </div>

      <div class="txt-field-group">
        <label for="txtFileTitle" class="txt-label">TXT File Title</label>
        <div class="txt-title-row">
          <input type="text" id="txtFileTitle" class="txt-input" placeholder="Enter file name (e.g. my-note)" autocomplete="off" />
          <span class="txt-ext">.txt</span>
        </div>
      </div>

      <div class="txt-field-group">
        <div class="txt-label-row">
          <label for="txtFileContent" class="txt-label">Write Text</label>
          <button type="button" id="txtSpeakBtn" class="txt-speak-btn" onclick="toggleTypedSpeech()" title="Listen to typed text">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
              <path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"/>
              <path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z"/>
              <path d="M8.707 11.182A4.5 4.5 0 0 0 10.025 8a4.5 4.5 0 0 0-1.318-3.182L8 5.525A3.5 3.5 0 0 1 9.025 8 3.5 3.5 0 0 1 8 10.475zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06"/>
            </svg>
            <span id="txtSpeakLabel">Listen</span>
          </button>
        </div>
        <textarea id="txtFileContent" class="txt-textarea" placeholder="Type your text here..."></textarea>
      </div>

      <div class="txt-modal-actions">
        <button type="button" class="txt-cancel-btn" onclick="toggleShareTxtModal(false)">Cancel</button>
        <button type="button" class="txt-share-btn" onclick="shareDirectTxtFile()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path d="M13.5 1a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3M11 2.5a2.5 2.5 0 1 1 .603 1.628l-6.718 3.12a2.5 2.5 0 0 1 0 1.504l6.718 3.12a2.5 2.5 0 1 1-.488.876l-6.718-3.12a2.5 2.5 0 1 1 0-3.256l6.718-3.12A2.5 2.5 0 0 1 11 2.5m-8.5 4a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3m11 5.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3"/>
          </svg>
          Share
        </button>
      </div>
    </div>
  </div>

  <!-- Main Diary Interface -->
  <div class="app-wrapper">
    <div id="bman">
      <!-- Top Header -->
      <header class="top-bar">
        <div class="brand-title">
          <span class="brand-dot"></span>
          Gauranga.
        </div>

        <div class="top-controls">
          <!-- Direct TXT Share Popup Button -->
          <button id="openTxtShareBtn" class="header-action-btn" onclick="toggleShareTxtModal(true)" title="Create & Share TXT">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5z"/>
              <path d="M8 7a.5.5 0 0 1 .5.5V9H10a.5.5 0 0 1 0 1H8.5v1.5a.5.5 0 0 1-1 0V10H6a.5.5 0 0 1 0-1h1.5V7.5A.5.5 0 0 1 8 7"/>
            </svg>
            <span>TXT Share</span>
          </button>

          <button id="openCalendarBtn" class="header-action-btn" style="display: none;" onclick="toggleCalendarModal(true)" title="Select Post Date">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z"/>
            </svg>
            <span>Select Date</span>
          </button>

          <!-- Day / Night Mode Toggle Button -->
          <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Day/Night Mode" title="Switch Theme">
            <!-- Moon Icon shown in Day Mode -->
            <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
              <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
            </svg>
            <!-- Sun Icon shown in Night Mode -->
            <svg id="sunIcon" style="display: none;" xmlns="http://www.w3.org/2000/svg" width="19" height="19" fill="currentColor" viewBox="0 0 16 16">
              <path d="M8 11a3 3 0 1 1 0-6 3 3 0 0 1 0 6m0 1a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 0 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 0 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 0 1 0 .708"/>
            </svg>
          </button>
        </div>
      </header>

      <!-- Diary Content Area -->
      <main id="fic">
        <div id="loader" class="loader">
          <div class="spinner"></div>
          <span>Opening your journal...</span>
        </div>
        <div id="blog-posts"></div>
      </main>

      <!-- Pagination Navigation -->
      <footer id="pagination" class="pagination-container" style="display: none;">
        <button id="prevBtn" class="nav-btn" onclick="changePost(-1)">
          &#8592; Newer Entry
        </button>
        <button id="nextBtn" class="nav-btn" onclick="changePost(1)">
          Older Entry &#8594;
        </button>
      </footer>
    </div>
  </div>

  <script>
    /* =========================================
       DAY / NIGHT THEME CONTROLLER (AUTO DEVICE SYNC + MANUAL OVERRIDE)
       ========================================= */
    var darkMediaQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

    function getSystemTheme() {
      return (darkMediaQuery && darkMediaQuery.matches) ? 'dark' : 'day';
    }

    function applyTheme(theme) {
      var moonIcon = document.getElementById('moonIcon');
      var sunIcon = document.getElementById('sunIcon');
      var themeMeta = document.getElementById('themeMeta');

      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
        moonIcon.style.display = 'none';
        sunIcon.style.display = 'block';
        themeMeta.setAttribute('content', '#05070c');
      } else {
        document.documentElement.removeAttribute('data-theme');
        moonIcon.style.display = 'block';
        sunIcon.style.display = 'none';
        themeMeta.setAttribute('content', '#f5f2eb');
      }
    }

    function initTheme() {
      applyTheme(getSystemTheme());
    }

    if (darkMediaQuery) {
      var handleSystemThemeChange = function(e) {
        applyTheme(e.matches ? 'dark' : 'day');
      };
      if (darkMediaQuery.addEventListener) {
        darkMediaQuery.addEventListener('change', handleSystemThemeChange);
      } else if (darkMediaQuery.addListener) {
        darkMediaQuery.addListener(handleSystemThemeChange);
      }
    }

    window.toggleTheme = function() {
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      applyTheme(isDark ? 'day' : 'dark');
    };

    initTheme();

    /* =========================================
       DIRECT TXT FILE SHARE & VOICE SPEAK
       ========================================= */
    var shareTxtModal = document.getElementById('shareTxtModal');
    var txtFileTitle = document.getElementById('txtFileTitle');
    var txtFileContent = document.getElementById('txtFileContent');
    var txtSpeakBtn = document.getElementById('txtSpeakBtn');
    var txtSpeakLabel = document.getElementById('txtSpeakLabel');
    var isTypedSpeaking = false;

    var TXT_SPEECH_RATE = 0.78;        // Quick TXT Share speed
    var MAIN_PAGE_SPEECH_RATE = 0.62;  // Very gentle, slow storytelling speed for main diary page
    var MAIN_PAGE_SPEECH_PITCH = 0.96; // Soft, warm tone

    function resetTypedSpeakButton() {
      isTypedSpeaking = false;
      if (txtSpeakBtn) txtSpeakBtn.classList.remove('speaking');
      if (txtSpeakLabel) txtSpeakLabel.textContent = 'Listen';
    }

    window.toggleTypedSpeech = function() {
      if (!('speechSynthesis' in window)) return;

      var textToSpeak = txtFileContent.value.trim();
      var synth = window.speechSynthesis;

      if (isTypedSpeaking) {
        synth.cancel();
        resetTypedSpeakButton();
        return;
      }

      if (!textToSpeak) return;

      if (synth.speaking || synth.pending) {
        synth.cancel();
        resetActiveButton();
      }

      setTimeout(function() {
        isTypedSpeaking = true;
        txtSpeakBtn.classList.add('speaking');
        txtSpeakLabel.textContent = 'Stop';

        var utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.rate = TXT_SPEECH_RATE;
        utterance.onend = function() {
          resetTypedSpeakButton();
        };
        utterance.onerror = function() {
          resetTypedSpeakButton();
        };
        synth.speak(utterance);
      }, 60);
    };

    window.toggleShareTxtModal = function(show) {
      if (!show && window.speechSynthesis && isTypedSpeaking) {
        window.speechSynthesis.cancel();
        resetTypedSpeakButton();
      }
      shareTxtModal.style.display = show ? 'flex' : 'none';
    };

    function getSanitizedTxtFilename() {
      var rawTitle = txtFileTitle.value.trim();
      if (!rawTitle) return 'untitled.txt';
      var clean = rawTitle.replace(/[\\/:*?"<>|]/g, '_');
      if (!clean.toLowerCase().endsWith('.txt')) {
        clean += '.txt';
      }
      return clean;
    }

    function createUtf8TxtBlob(content) {
      var bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
      return new Blob([bom, content], { type: 'text/plain;charset=utf-8' });
    }

    window.shareDirectTxtFile = async function() {
      var content = txtFileContent.value;
      if (!content.trim()) return;

      var filename = getSanitizedTxtFilename();
      var blob = createUtf8TxtBlob(content);
      var file = new File([blob], filename, { type: 'text/plain' });

      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({
            files: [file],
            title: filename,
            text: content
          });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }

      if (navigator.share) {
        try {
          await navigator.share({
            title: filename,
            text: filename + '\n\n' + content
          });
          return;
        } catch (err2) {
          if (err2 && err2.name === 'AbortError') return;
        }
      }
    };

    /* =========================================
       GOOGLE DRIVE DIARY ENGINE
       ========================================= */
    var API_KEY = 'AIzaSyAvp5UjI4PBw50kpG8l3fKjPYsKFSXU5vM';
    var FOLDER_ID = '1f6U9Luvm85-s0ofbdWS0KNIAq75zUWCw';

    var blogContainer = document.getElementById('blog-posts');
    var ficContainer = document.getElementById('fic');
    var loader = document.getElementById('loader');
    var openCalendarBtn = document.getElementById('openCalendarBtn');
    var calendarModal = document.getElementById('calendarModal');
    var calMonthYear = document.getElementById('calMonthYear');
    var calDaysGrid = document.getElementById('calDaysGrid');
    var paginationContainer = document.getElementById('pagination');
    var prevBtn = document.getElementById('prevBtn');
    var nextBtn = document.getElementById('nextBtn');

    var currentUtterance = null;
    var activePlayButton = null;
    var speechDataStore = {};
    var currentPlayingId = null;
    var allPosts = [];
    var filteredPosts = [];
    var currentIndex = 0;

    var currentDateObj = new Date();
    var viewYear = currentDateObj.getFullYear();
    var viewMonth = currentDateObj.getMonth();

    var playIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"/><path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z"/><path d="M8.707 11.182A4.5 4.5 0 0 0 10.025 8a4.5 4.5 0 0 0-1.318-3.182L8 5.525A3.5 3.5 0 0 1 9.025 8 3.5 3.5 0 0 1 8 10.475zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06"/></svg>';
    var pauseIcon = '<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16"><path d="M5 3.5h6A1.5 1.5 0 0 1 12.5 5v6a1.5 1.5 0 0 1-1.5 1.5H5A1.5 1.5 0 0 1 3.5 11V5A1.5 1.5 0 0 1 5 3.5"/></svg>';

    function fetchBlogPosts() {
      var listUrl = 'https://www.googleapis.com/drive/v3/files?q=\'' + FOLDER_ID + '\'+in+parents+and+mimeType=\'text/plain\'+and+trashed=false&fields=files(id,name,modifiedTime)&key=' + API_KEY;
      fetch(listUrl)
        .then(function(response) { return response.json(); })
        .then(function(data) {
          if (!data.files || data.files.length === 0) {
            loader.innerHTML = "<span>No diary entries found.</span>";
            return;
          }

          data.files.sort(function(a, b) {
            return new Date(b.modifiedTime) - new Date(a.modifiedTime);
          });

          loader.style.display = 'none';

          var promises = data.files.map(function(file) {
            var contentUrl = 'https://www.googleapis.com/drive/v3/files/' + file.id + '?alt=media&key=' + API_KEY;
            return fetch(contentUrl)
              .then(function(res) { return res.text(); })
              .then(function(textContent) {
                var title = file.name.replace('.txt', '');
                var dateObj = new Date(file.modifiedTime);
                var options = { day: 'numeric', month: 'long', year: 'numeric' };
                var date = dateObj.toLocaleDateString('en-US', options);
                var storageId = 'speech_' + file.id;
                speechDataStore[storageId] = textContent;

                allPosts.push({
                  title: title,
                  date: date,
                  dateObj: dateObj,
                  textContent: textContent,
                  storageId: storageId
                });
              })
              .catch(function(err) { console.error(err); });
          });

          Promise.all(promises).then(function() {
            allPosts.sort(function(a, b) { return b.dateObj - a.dateObj; });
            filteredPosts = allPosts.slice();
            openCalendarBtn.style.display = 'flex';
            if (filteredPosts.length > 0) {
              displayCurrentPost();
              paginationContainer.style.display = 'flex';
            }
          });
        })
        .catch(function(error) {
          loader.innerHTML = "<span style='color: #e11d48;'>Unable to load diary entries.</span>";
          console.error(error);
        });
    }

    function displayCurrentPost() {
      if (filteredPosts.length === 0) {
        blogContainer.innerHTML = '<div class="post-card"><p style="text-align:center; color:var(--text-muted);">No entries found for this date.</p></div>';
        paginationContainer.style.display = 'none';
        return;
      }

      var post = filteredPosts[currentIndex];
      blogContainer.innerHTML =
        '<article class="post-card">' +
          '<div class="post-header">' +
            '<h1 class="post-title">' + escapeHTML(post.title) + '</h1>' +
            '<div class="post-meta">' +
              '<span class="date-badge">' +
                '<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" fill="currentColor" viewBox="0 0 16 16"><path d="M14 0H2a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2M1 3.857C1 3.384 1.448 3 2 3h12c.552 0 1 .384 1 .857v10.286c0 .473-.448.857-1 .857H2c-.552 0-1-.384-1-.857z"/></svg>' +
                post.date +
              '</span>' +
              '<button class="audio-control-btn" onclick="toggleSpeech(this, \'' + post.storageId + '\')" title="Listen to entry">' +
                playIcon +
              '</button>' +
            '</div>' +
          '</div>' +
          '<div class="post-body">' + escapeHTML(post.textContent) + '</div>' +
        '</article>';

      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === filteredPosts.length - 1;
      paginationContainer.style.display = 'flex';
      ficContainer.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.changePost = function(direction) {
      if (window.speechSynthesis) {
        window.speechSynthesis.cancel();
        resetActiveButton();
        resetTypedSpeakButton();
      }
      currentIndex += direction;
      if (currentIndex < 0) currentIndex = 0;
      if (currentIndex >= filteredPosts.length) currentIndex = filteredPosts.length - 1;
      displayCurrentPost();
    };

    window.toggleCalendarModal = function(show) {
      calendarModal.style.display = show ? 'flex' : 'none';
      if (show) renderCalendar();
    };

    window.handleModalOutsideClick = function(event, modalId) {
      var targetModal = document.getElementById(modalId);
      if (event.target === targetModal) {
        if (modalId === 'shareTxtModal') {
          toggleShareTxtModal(false);
        } else {
          targetModal.style.display = 'none';
        }
      }
    };

    window.changeMonth = function(direction) {
      viewMonth += direction;
      if (viewMonth > 11) {
        viewMonth = 0;
        viewYear++;
      } else if (viewMonth < 0) {
        viewMonth = 11;
        viewYear--;
      }
      renderCalendar();
    };

    function renderCalendar() {
      var months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      calMonthYear.textContent = months[viewMonth] + " " + viewYear;
      calDaysGrid.innerHTML = "";

      var firstDayIndex = new Date(viewYear, viewMonth, 1).getDay();
      var totalDays = new Date(viewYear, viewMonth + 1, 0).getDate();

      for (var i = 0; i < firstDayIndex; i++) {
        var emptyDiv = document.createElement('div');
        emptyDiv.className = 'cal-day empty';
        calDaysGrid.appendChild(emptyDiv);
      }

      for (var day = 1; day <= totalDays; day++) {
        var dayDiv = document.createElement('div');
        dayDiv.className = 'cal-day';
        dayDiv.textContent = day;

        var currentIterDate = new Date(viewYear, viewMonth, day);
        var matchingPostIndex = allPosts.findIndex(function(p) {
          return p.dateObj.getDate() === currentIterDate.getDate() &&
                 p.dateObj.getMonth() === currentIterDate.getMonth() &&
                 p.dateObj.getFullYear() === currentIterDate.getFullYear();
        });

        if (matchingPostIndex !== -1) {
          dayDiv.classList.add('has-post');
          (function(index) {
            dayDiv.onclick = function() {
              if (window.speechSynthesis) {
                window.speechSynthesis.cancel();
                resetActiveButton();
                resetTypedSpeakButton();
              }
              filteredPosts = allPosts.slice();
              currentIndex = index;
              displayCurrentPost();
              toggleCalendarModal(false);
            };
          })(matchingPostIndex);
        }
        calDaysGrid.appendChild(dayDiv);
      }
    }

    window.toggleSpeech = function(btn, storageId) {
      if (!('speechSynthesis' in window)) return;
      var text = speechDataStore[storageId] || "";
      var synth = window.speechSynthesis;

      if (currentPlayingId === storageId) {
        synth.cancel();
        resetActiveButton();
        return;
      }
      if (synth.speaking || synth.pending) {
        synth.cancel();
        resetActiveButton();
        resetTypedSpeakButton();
      }

      setTimeout(function() {
        activePlayButton = btn;
        currentPlayingId = storageId;
        currentUtterance = new SpeechSynthesisUtterance(text);
        currentUtterance.rate = MAIN_PAGE_SPEECH_RATE;
        currentUtterance.pitch = MAIN_PAGE_SPEECH_PITCH;
        currentUtterance.onend = function() { resetActiveButton(); };
        currentUtterance.onerror = function() { resetActiveButton(); };
        setPlayingState(btn);
        synth.speak(currentUtterance);
      }, 60);
    };

    function setPlayingState(btn) {
      btn.innerHTML = pauseIcon;
      btn.classList.add('playing');
    }

    function resetActiveButton() {
      if (activePlayButton) {
        activePlayButton.innerHTML = playIcon;
        activePlayButton.classList.remove('playing');
        activePlayButton = null;
      }
      currentPlayingId = null;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, function(tag) {
        var chars = {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        };
        return chars[tag] || tag;
      });
    }

    fetchBlogPosts();
  </script>
</body>
</html>
